name: CI

on:
  push:
    branches:
      - main
      - master
      - development
  pull_request:
    branches:
      - main
      - master
      - development

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: go/web/frontend/package-lock.json

      - name: Install frontend deps
        working-directory: go/web/frontend
        run: npm ci

      - name: Build React SPA
        working-directory: go
        run: make ui-sync-dist

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'

      - name: Run Go tests
        working-directory: go
        run: go test ./...
