# Live reload for hub backend (used by make dev-watch).
root = "."
tmp_dir = "tmp/air-hub"

[build]
  cmd = "make ui-sync-dist && go build -o ./tmp/air-hub/hub ./cmd/hub"
  bin = "./tmp/air-hub/hub"
  include_ext = ["go", "html", "js", "css"]
  include_dir = ["internal/webui"]
  exclude_dir = ["tmp", "bin", "web"]
  delay = 400

[log]
  time = true
