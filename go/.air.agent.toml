# Live reload for push agent (used by make dev-watch).
root = "."
tmp_dir = "tmp/air-agent"

[build]
  cmd = "go build -o ./tmp/air-agent/agent ./cmd/agent"
  bin = "./tmp/air-agent/agent"
  include_ext = ["go"]
  exclude_dir = ["tmp", "bin", "web", "internal/webui"]
  delay = 400

[log]
  time = true
