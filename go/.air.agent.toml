# Live reload for push agent (used by make dev-watch).
root = "."
tmp_dir = "tmp/air-agent"

[build]
  cmd = "make ui-sync-dist && go build -o ./tmp/air-agent/agent ./cmd/agent"
  bin = "./tmp/air-agent/agent"
  include_ext = ["go", "html", "js", "css"]
  include_dir = ["internal/webui"]
  exclude_dir = ["tmp", "bin", "web"]
  delay = 400

[log]
  time = true
