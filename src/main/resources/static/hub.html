<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metrics Hub</title>
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <header>
    <h1 data-i18n="hub.title">Metrics Hub</h1>
    <div class="header-right">
      <select id="lang-select" aria-label="Language">
        <option value="en">English</option>
        <option value="tr">Türkçe</option>
      </select>
      <div class="status-pill">
        <span data-i18n="hub.agentCount">Agents</span>:
        <span id="agent-count">0</span>
      </div>
    </div>
  </header>

  <main>
    <div id="waiting" data-i18n="hub.waiting">Waiting for agents…</div>
    <div id="hub-dashboard" hidden>
      <section id="agent-grid" class="container-grid"></section>
      <section class="panel" id="agent-detail" hidden>
        <h2 id="detail-title">—</h2>
        <div class="cards">
          <div class="card">
            <div class="card-label" data-i18n="card.cpu">CPU</div>
            <div class="card-value" id="detail-cpu">—</div>
            <div class="card-sub" id="detail-cpu-sub"></div>
            <div class="bar"><div class="bar-fill" id="detail-cpu-bar" style="width:0%"></div></div>
          </div>
          <div class="card">
            <div class="card-label" data-i18n="card.memory">Memory</div>
            <div class="card-value" id="detail-mem">—</div>
            <div class="card-sub" id="detail-mem-sub"></div>
            <div class="bar"><div class="bar-fill" id="detail-mem-bar" style="width:0%"></div></div>
          </div>
          <div class="card">
            <div class="card-label" data-i18n="card.containers">Containers</div>
            <div class="card-value" id="detail-containers">0</div>
          </div>
        </div>
        <p class="usage-meta" id="detail-last-seen"></p>
      </section>
    </div>
  </main>

  <script type="module" src="/js/hub.js"></script>
</body>
</html>
