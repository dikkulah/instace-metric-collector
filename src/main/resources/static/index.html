<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instance Metric Collector</title>
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <header>
    <div class="header-left">
      <nav class="app-nav" aria-label="Main">
        <a href="/" class="active" data-i18n="nav.dashboard">Dashboard</a>
        <a href="/processes.html" data-i18n="nav.processes">Processes</a>
        <a href="/services.html" data-i18n="nav.services">Services</a>
      </nav>
      <h1 data-i18n="app.title">Instance Metric Collector</h1>
    </div>
    <div class="header-right">
      <select id="lang-select" aria-label="Language">
        <option value="en">English</option>
        <option value="tr">Türkçe</option>
      </select>
      <div class="status-pill">
        <span id="status-dot" class="status-dot offline"></span>
        <span id="status-label" data-i18n-dynamic>Offline</span>
      </div>
      <div class="status-pill">
        <span data-i18n="app.lastUpdate">Last update</span>:
        <span id="last-update">—</span>
      </div>
    </div>
  </header>

  <main>
    <div id="waiting" data-i18n="app.waiting">Waiting for first metrics…</div>
    <div id="dashboard" class="dashboard" hidden>
      <section class="cards summary-cards">
        <div class="card">
          <div class="card-label" data-i18n="card.cpu">CPU</div>
          <div class="card-value" id="cpu-value">—</div>
          <div class="card-sub" id="cpu-sub"></div>
          <div class="bar"><div class="bar-fill" id="cpu-bar" style="width:0%"></div></div>
        </div>
        <div class="card">
          <div class="card-label" data-i18n="card.memory">Memory</div>
          <div class="card-value" id="mem-value">—</div>
          <div class="card-sub" id="mem-sub"></div>
          <div class="bar"><div class="bar-fill" id="mem-bar" style="width:0%"></div></div>
        </div>
        <div class="card">
          <div class="card-label" data-i18n="card.containers">Containers</div>
          <div class="card-value" id="container-count">0</div>
          <div class="card-sub" id="container-healthy"></div>
        </div>
      </section>

      <section class="grid-2 grid-usage">
        <div class="panel panel-usage">
          <h2 class="panel-title" data-i18n="section.disk">Disk</h2>
          <div class="panel-body">
            <div id="disk-list" class="usage-list"></div>
          </div>
        </div>
        <div class="panel panel-usage">
          <h2 class="panel-title" data-i18n="section.network">Network</h2>
          <div class="panel-body">
            <div id="network-list" class="usage-list"></div>
          </div>
        </div>
      </section>

      <section class="workloads-grid">
        <div class="panel panel-processes">
          <div class="panel-header">
            <h2 class="panel-title" data-i18n="section.processes">Processes</h2>
            <a href="/processes.html" class="link-btn" data-i18n="processes.viewAll">View all</a>
          </div>
          <div class="panel-body table-wrap">
            <table class="data-table process-table">
              <thead>
                <tr>
                  <th class="col-pid" data-i18n="table.pid">PID</th>
                  <th class="col-name" data-i18n="table.name">Name</th>
                  <th class="col-cpu" data-i18n-title="cpu.hint.combined" data-i18n="table.cpu">CPU</th>
                  <th class="col-mem num" data-i18n="table.memory">Memory %</th>
                </tr>
              </thead>
              <tbody id="process-body"></tbody>
            </table>
          </div>
          <div class="panel-footer" id="process-footer" hidden>
            <span id="process-showing" class="panel-footer-meta"></span>
            <button type="button" id="process-load-more" class="secondary-btn" data-i18n="processes.loadMore">Show 10 more</button>
          </div>
        </div>
        <div class="panel panel-services">
          <div class="panel-header">
            <h2 class="panel-title" data-i18n="section.services">Services</h2>
            <div class="panel-header-actions">
              <a href="/services.html" class="link-btn" data-i18n="services.viewAll">View all</a>
              <label class="service-sort-label">
                <span class="sr-only" data-i18n="services.sort.label">Sort</span>
                <select id="service-sort" class="service-sort" aria-label="Sort services"></select>
              </label>
              <div class="view-toggle" role="group" aria-label="Service view">
                <button type="button" id="service-view-tree" class="view-toggle-btn active" data-i18n="services.view.tree">Tree</button>
                <button type="button" id="service-view-list" class="view-toggle-btn" data-i18n="services.view.list">List</button>
              </div>
            </div>
          </div>
          <div class="panel-body">
            <div id="service-list" class="service-list"></div>
          </div>
          <div id="service-detail" class="service-detail" hidden>
            <div class="service-detail-header">
              <h3 id="service-detail-title">—</h3>
              <div class="service-detail-actions">
                <a id="service-detail-open" class="link-btn" href="/services.html" data-i18n="services.detail.viewFull">View full details</a>
                <button type="button" id="service-detail-close" class="secondary-btn" data-i18n="container.close">Close</button>
              </div>
            </div>
            <dl class="detail-grid" id="service-detail-body"></dl>
          </div>
        </div>
      </section>

      <section class="panel panel-docker">
        <h2 class="panel-title" data-i18n="section.docker">Docker containers</h2>
        <div class="panel-body">
          <div id="container-grid" class="container-grid"></div>
        </div>
        <div id="container-detail" class="container-detail" hidden>
          <div class="container-detail-header">
            <h3 id="container-detail-title">—</h3>
            <button type="button" id="container-detail-close" class="secondary-btn" data-i18n="container.close">Close</button>
          </div>
          <dl class="detail-grid" id="container-detail-body"></dl>
        </div>
      </section>
    </div>
  </main>

  <script type="module" src="/js/dashboard.js?v=4"></script>
</body>
</html>
