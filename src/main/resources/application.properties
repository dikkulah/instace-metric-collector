spring.application.name=instance-metric-collector
metrics.collection.interval=60000
# Hub mode (Phase 7) — metrics.hub.enabled=true on central server
metrics.hub.enabled=false
metrics.hub.history.size=60
metrics.hub.ingest.token=
# Agent push to hub (Phase 2/7) — metrics.push.enabled=true on agents
metrics.push.enabled=false
metrics.push.ingest-url=http://localhost:8080/api/v1/ingest
metrics.push.agent-id=
metrics.push.auth-token=
# Alerts (hub only) — webhook on CPU/RAM/container thresholds
metrics.alerts.enabled=true
metrics.alerts.webhook-url=
metrics.alerts.cpu-threshold=0.90
metrics.alerts.memory-threshold=0.90
metrics.alerts.cooldown-seconds=300
metrics.api.endpoint=http://your-metrics-server/api/metrics
# Actuator ops probes (Phase 4) — off by default; see docs/ACTUATOR.md
metrics.actuator.enabled=false
metrics.ui.enabled=true
metrics.ui.history.size=60
metrics.ui.refresh.interval=5000
metrics.ui.default-locale=en
metrics.ui.locales=en,tr
docker.enabled=true
# Leave empty to auto-detect: DOCKER_HOST, ~/.docker/run/docker.sock (Desktop), then /var/run/docker.sock
docker.host=
docker.collection.interval=15000
logging.file.name=metrics-collector.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n